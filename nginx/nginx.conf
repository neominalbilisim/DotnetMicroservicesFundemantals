events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------
    # Upstream: .NET uygulaması
    #
    # Senaryo A (varsayılan - geliştirme): Uygulama "dotnet run" ile
    # HOST makinede çalışıyor -> host.docker.internal kullanılır.
    #
    # Senaryo B (container'a alınmış uygulama): Uygulama da bu
    # compose network'üne eklenmişse, aşağıdaki satırı
    # "server app:8080;" olarak değiştirin (bkz. README - Bölüm 6).
    # -------------------------------------------------------------
    upstream dotnet_app {
        server host.docker.internal:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Basit istek/hata logları
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log;

        location / {
            proxy_pass http://dotnet_app;

            # .NET tarafında gerçek istemci bilgisinin (IP, protokol, host)
            # doğru okunabilmesi için forwarded header'lar
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }

        # Health check endpoint'i doğrudan proxy'den de erişilebilir olsun
        location /health {
            proxy_pass http://dotnet_app/health;
            access_log off;
        }
    }
}
